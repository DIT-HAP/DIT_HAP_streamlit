title: tricarboxylic acid cycle (GO:0006099)
taxon: NCBITaxon:4896
status: production
date_modified: '2026-01-17'
comments:
- 'Automated change 2025-04-24: GO:0004108 replaced by GO:0036440'
- KGD4 is thought to act as an adaptor or stabilizing protein that facilitates the
  interaction between these three core subunits, particularly helping to link the
  E2 component (DLST) with the E3 component (DLD).
- aco2 is TCA in S. cerevisiae when glucose is limiting
- 'directons, particularly fumerate hydratase  /dehydratase

  '
